events {}

http {
  # Docker DNS returns one A record per `app` replica; nginx round-robins across all of them.
  upstream wagering_app {
    server app:3000;
    keepalive 32;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://wagering_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }
  }
}
